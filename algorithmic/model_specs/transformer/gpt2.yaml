# Local GPT-2 blocks with absolute position embeddings.
model_family: transformer

# Each entry may give a scalar or a list per field and expands to the cross
# product of its lists, so widening a field turns this into a sweep. The
# commented values are the full grid the paper searched over.
architectures:
  - n_layer: [1, 2, 4]
    n_head: [1, 2, 4]
    d_model: [16, 64, 256]
    dropout: [0, 0.1]
    lr: [1.0e-3, 1.0e-4]
    between_block_mlp_layers: 1
    layer_norm: true
