# Local hybrid: S4 block followed by a GPT-2 attention block, with absolute
# position embeddings. n_layer is the number of times the pattern repeats.
model_family: hybrid
hybrid_layer_pattern: sa
ssm_kernel: s4

# Each entry may give a scalar or a list per field and expands to the cross
# product of its lists; this one is the full grid (3 * 2 * 3 * 2 * 2 = 72 slots).
architectures:
  - n_layer: [1, 2, 4]
    n_head: [2, 4]
    d_model: [16, 64, 256]
    dropout: [0, 0.1]
    lr: [1.0e-3, 1.0e-4]
    between_block_mlp_layers: 1
    layer_norm: true
